[package]
name = "mkfm"
version = "0.1.2"
edition = "2024"
description = "A minimal file manager with vim-like modal keybindings"
license = "GPL-3.0"

[dependencies]
# UI toolkit
mkui = { path = "../mkui" }

# Wayland (for attached surface overlay)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-backend = "0.3"
wayland-scanner = "0.31"

# Window access (for Wayland handle detection)
winit = "0.30"
rwh_06 = { package = "raw-window-handle", version = "0.6" }

# Image loading and EXIF
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
kamadak-exif = "0.6"
resvg = "0.45"

# System
libc = "0.2"

# File system
walkdir = "2"
mime_guess = "2"
infer = "0.16"

# Async runtime for file operations
tokio = { version = "1", features = ["rt", "fs", "sync"] }

# Configuration management
prefer = "0.2"
toml = "0.8"
dirs = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
